[project]
name = "backend"
version = "0.21.0"
description = "Flask API that serves masked environmental monitoring station data to the map frontend."
readme = "README.md"
authors = [
    { name = "Nicholas-Turner", email = "nicholasoranturner@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle (PEP 8), pyflakes, isort, pep8-naming, pydocstyle, pyupgrade, bugbear.
select = ["E", "W", "F", "I", "N", "D", "UP", "B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Integration tests call a real Supabase project, so they only run when asked for:
#   SUPABASE_URL=... SUPABASE_KEY=<anon key> uv run pytest -m integration
addopts = ["-m", "not integration"]
markers = ["integration: needs a real Supabase project (SUPABASE_URL and SUPABASE_KEY)"]
# supabase-py 2.33 always passes `timeout` and `verify` to postgrest-py, which warns
# that both are deprecated. It isn't avoidable from our side, and the timeout still
# applies (checked in map commit 8). Remove this when supabase-py stops passing them.
filterwarnings = [
    "ignore:The '(timeout|verify)' parameter is deprecated:DeprecationWarning",
]
