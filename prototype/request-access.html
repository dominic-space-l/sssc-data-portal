<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Request Access | Prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    label { display: block; margin-top: .75rem; }
    input, textarea { width: 100%; padding: .45rem; box-sizing: border-box; font: inherit; }
    textarea { min-height: 7rem; }
    button { margin-top: 1rem; padding: .5rem 1rem; }
    .cf-turnstile { margin-top: 1rem; }
    #msg { margin-top: 1rem; }
  </style>
</head>
<body>
  <p><a href="index.html">Back</a></p>
  <h1>Request access</h1>
  <p>Outside organizations: ask for a link to submit data. We'll review your request and email you.</p>

  <form id="request">
    <label>Organization name * <input name="orgName" required maxlength="200" /></label>
    <label>Your name <input name="contactName" maxlength="200" /></label>
    <label>Email * <input name="email" type="email" required maxlength="320" /></label>
    <label>Why do you need access? <textarea name="reason" maxlength="2000"></textarea></label>
    <div id="turnstile" class="cf-turnstile"></div>
    <button type="submit">Send request</button>
  </form>
  <p id="msg"></p>
  <p>Questions? Contact <a id="contact"></a>.</p>

  <script src="config.js"></script>
  <script>
    // Set the bot-check key and contact email from config.js before the Turnstile script loads.
    document.getElementById("turnstile").dataset.sitekey = window.APP_CONFIG.TURNSTILE_SITE_KEY;
    const contact = document.getElementById("contact");
    contact.textContent = window.APP_CONFIG.CONTACT_EMAIL;
    contact.href = "mailto:" + window.APP_CONFIG.CONTACT_EMAIL;
  </script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script type="module">
    import * as Auth from "./auth/auth.js";
    Auth.initAuth(window.APP_CONFIG);

    const form = document.getElementById("request");
    const msg = document.getElementById("msg");

    form.onsubmit = async (e) => {
      e.preventDefault();
      const fields = new FormData(form);
      const token = fields.get("cf-turnstile-response");
      if (!token) { msg.textContent = "Please complete the bot check first."; return; }

      msg.textContent = "Sending...";
      const result = await Auth.requestAccess({
        orgName: fields.get("orgName"),
        contactName: fields.get("contactName"),
        email: fields.get("email"),
        reason: fields.get("reason"),
        turnstileToken: token,
      });

      if (result.ok) {
        form.hidden = true;
        msg.textContent = `Thanks! Your request was sent. You'll hear back by email. Questions? Contact ${window.APP_CONFIG.CONTACT_EMAIL}.`;
      } else {
        msg.textContent = `Couldn't send: ${result.message}`;
        window.turnstile?.reset();
      }
    };
  </script>
</body>
</html>
