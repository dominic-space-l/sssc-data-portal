<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | Prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border-bottom: 1px solid #ddd; padding: .5rem; text-align: left; vertical-align: top; }
    button { padding: .35rem .8rem; margin-right: .3rem; }
    .bar { background: #eef3fb; padding: .5rem .75rem; border-radius: 6px; }
    #result { background: #f4f9f4; border: 1px solid #cde3cd; padding: .75rem; border-radius: 6px; margin: 1rem 0; }
    #result input { width: 100%; padding: .4rem; box-sizing: border-box; font-family: ui-monospace, monospace; }
    .muted { color: #666; }
  </style>
</head>
<body hidden>
  <p><a href="index.html">Back</a></p>
  <h1>Admin dashboard</h1>
  <p class="bar" id="who">checking...</p>

  <div id="result" hidden></div>

  <h2>Access requests waiting for review</h2>
  <p><button id="refresh">Refresh</button></p>
  <table>
    <thead><tr><th>Organization</th><th>Contact</th><th>Reason</th><th>Received</th><th></th></tr></thead>
    <tbody id="requests"><tr><td colspan="5" class="muted">Loading...</td></tr></tbody>
  </table>

  <h2>Submissions waiting for review</h2>
  <p class="muted">Coming on Day 4.</p>

  <script src="config.js"></script>
  <script type="module">
    import * as Auth from "./auth/auth.js";
    Auth.initAuth(window.APP_CONFIG);

    const $ = (id) => document.getElementById(id);
    const user = await Auth.getUser();
    if (!user) { location.replace("login.html?next=admin.html"); throw new Error("Not logged in"); }
    document.body.hidden = false;
    $("who").textContent = `Logged in as ${user?.email ?? ""}`;

    // Builds an element with plain text only (never HTML), so request text can't inject anything.
    const el = (tag, text, attrs = {}) => {
      const node = document.createElement(tag);
      if (text != null) node.textContent = text;
      Object.assign(node, attrs);
      return node;
    };

    const mailto = (to, subject, body) =>
      `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;

    function showResult(nodes) {
      const box = $("result");
      box.replaceChildren(...nodes);
      box.hidden = false;
    }

    async function load() {
      const body = $("requests");
      const message = (text) => {
        const row = el("tr");
        row.append(el("td", text, { colSpan: 5, className: "muted" }));
        body.replaceChildren(row);
      };
      message("Loading...");
      const result = await Auth.listAccessRequests();
      if (!result.ok) return message(`Error: ${result.message}`);
      if (result.requests.length === 0) return message("Nothing waiting.");
      body.replaceChildren();
      for (const r of result.requests) {
        const row = el("tr");
        row.append(
          el("td", r.org_name),
          el("td", [r.contact_name, r.email].filter(Boolean).join("\n"), { style: "white-space: pre-line" }),
          el("td", r.reason ?? ""),
          el("td", new Date(r.created_at).toLocaleString()),
        );
        const actions = el("td");
        const approve = el("button", "Approve");
        const reject = el("button", "Reject");
        approve.onclick = () => decide(r, true, approve, reject);
        reject.onclick = () => decide(r, false, approve, reject);
        actions.append(approve, reject);
        row.append(actions);
        body.append(row);
      }
    }

    async function decide(r, approved, ...buttons) {
      buttons.forEach((b) => (b.disabled = true));
      const result = approved ? await Auth.approveRequest(r.id) : await Auth.rejectRequest(r.id);
      if (!result.ok) {
        showResult([el("p", `Error: ${result.message}`)]);
        buttons.forEach((b) => (b.disabled = false));
        return;
      }

      if (approved) {
        const expires = new Date(result.expiresAt).toLocaleDateString();
        const linkBox = el("input", null, { value: result.link, readOnly: true });
        const copy = el("button", "Copy link");
        copy.onclick = async () => { await navigator.clipboard.writeText(result.link); copy.textContent = "Copied"; };
        const draft = el("a", "Open an email draft to them", {
          href: mailto(result.email, "Your data portal link",
            `Hi,\n\nYour request to submit data has been approved. Use this one-time link to submit:\n\n${result.link}\n\nThe link works once and expires on ${expires}.\n\nThanks`),
        });
        showResult([
          el("p", `Approved ${result.orgName}. One-time link (expires ${expires}):`),
          linkBox, el("p", null), copy, el("span", "  "), draft,
        ]);
      } else {
        const draft = el("a", "Open an email draft to them", {
          href: mailto(result.email, "Your data portal access request",
            `Hi,\n\nThanks for your interest. We aren't able to approve your request at this time.\n\nThanks`),
        });
        showResult([el("p", `Rejected ${result.orgName}. Let them know if you'd like: `), draft]);
      }
      load();
    }

    $("refresh").onclick = load;
    load();
  </script>
</body>
</html>
