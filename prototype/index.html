<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Data Portal Prototype</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    button { padding: .45rem .9rem; margin: 0 .4rem .4rem 0; }
    pre { background: #f4f4f4; padding: .75rem; white-space: pre-wrap; }
    .bar { background: #eef3fb; padding: .5rem .75rem; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>Data Portal Prototype</h1>
  <p class="bar">Status: <span id="who">checking...</span> <button id="logout" hidden>Log out</button></p>

  <h2>Pages</h2>
  <ul>
    <li><a href="login.html">Login</a></li>
    <li><a href="form.html">Form</a> (admin submits directly)</li>
    <li><a href="csv-upload.html">CSV Upload</a></li>
    <li><a href="request-access.html">Request Access</a></li>
    <li><a href="submit.html">Submit by Link</a></li>
    <li><a href="admin.html">Admin Dashboard</a></li>
  </ul>

  <h2>Checks</h2>
  <p>Connection</p>
  <button id="db">Test database connection</button>
  <p>Day 2</p>
  <button id="signup">Sign-up is blocked</button>
  <button id="private">Private tables are hidden</button>
  <button id="loggedout">Logged-out add is blocked</button>
  <pre id="out">Results show here.</pre>

  <script src="config.js"></script>
  <script type="module">
    import * as Auth from "./auth/auth.js";
    const cfg = window.APP_CONFIG;
    Auth.initAuth(cfg);
    const formTable = cfg.FORM_TABLE || cfg.TEST_TABLE;

    const who = document.getElementById("who");
    const logoutBtn = document.getElementById("logout");
    const show = (label, result) => {
      document.getElementById("out").textContent = `${label}\n${JSON.stringify(result, null, 2)}`;
    };

    const render = (user) => {
      who.textContent = user ? `logged in as ${user.email}` : "not logged in";
      logoutBtn.hidden = !user;
    };
    render(await Auth.getUser());
    Auth.onAuthChange(render);

    logoutBtn.onclick = async () => show("Log out:", await Auth.logout());
    document.getElementById("db").onclick = async () => show("Database:", await Auth.testConnection(cfg.TEST_TABLE));
    document.getElementById("signup").onclick = async () => show("Sign-up blocked:", await Auth.checkSignupBlocked());
    document.getElementById("private").onclick = async () => show("Private hidden:", await Auth.checkPrivateHidden());
    document.getElementById("loggedout").onclick = async () => show(`Logged-out add blocked (${formTable}):`, await Auth.checkLoggedOutBlocked(formTable));
  </script>
</body>
</html>
