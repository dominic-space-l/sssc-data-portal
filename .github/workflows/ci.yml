# Continuous integration: lint, format-check, test, and build every app in the repo.
#
# Role: runs on pushes to main and on every pull request. Each job mirrors an npm script
# from the root package.json, so any failure can be reproduced locally with the same command.
#
# Usage (local equivalents, from the repo root):
#   npm run lint && npm run format:check && npm test && npm run build   # frontend job
#   npm run lint:backend && npm run test:backend                        # backend job

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (map + portal)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm version
        run: npm install -g npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Check formatting (Prettier)
        run: npm run format:check

      - name: Test (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Map backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: map/backend
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: map/backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (Ruff)
        run: uv run ruff check --output-format=github

      - name: Check formatting (Ruff)
        run: uv run ruff format --check

      - name: Test (pytest)
        run: uv run pytest
